version: "3"

tasks:
  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w -s .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...
    preconditions:
      - sh: which golangci-lint
        msg: "golangci-lint not installed. See https://golangci-lint.run/usage/install/"

  test:
    desc: Run tests
    cmds:
      - go test -race -count=1 ./...

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - go test -v -race -count=1 ./...

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - go tool cover -html=coverage.txt -o coverage.html
      - go tool cover -func=coverage.txt

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  build:examples:
    desc: Build example binaries for the native platform
    cmds:
      - mkdir -p ./bin
      - go build -o ./bin/basic ./examples/basic/
      - go build -o ./bin/sllm ./examples/sllm/
      - go build -o ./bin/infer ./examples/infer/

  build:examples:linux:
    desc: Build example binaries for Linux (amd64 and arm64)
    cmds:
      - mkdir -p ./bin/linux_amd64 ./bin/linux_arm64
      - GOOS=linux GOARCH=amd64 go build -o ./bin/linux_amd64/basic ./examples/basic/
      - GOOS=linux GOARCH=amd64 go build -o ./bin/linux_amd64/sllm  ./examples/sllm/
      - GOOS=linux GOARCH=amd64 go build -o ./bin/linux_amd64/infer ./examples/infer/
      - GOOS=linux GOARCH=arm64 go build -o ./bin/linux_arm64/basic ./examples/basic/
      - GOOS=linux GOARCH=arm64 go build -o ./bin/linux_arm64/sllm  ./examples/sllm/
      - GOOS=linux GOARCH=arm64 go build -o ./bin/linux_arm64/infer ./examples/infer/

  build:examples:windows:
    desc: Build example binaries for Windows (amd64 and arm64)
    cmds:
      - mkdir -p ./bin/windows_amd64 ./bin/windows_arm64
      - GOOS=windows GOARCH=amd64 go build -o ./bin/windows_amd64/basic.exe ./examples/basic/
      - GOOS=windows GOARCH=amd64 go build -o ./bin/windows_amd64/sllm.exe  ./examples/sllm/
      - GOOS=windows GOARCH=amd64 go build -o ./bin/windows_amd64/infer.exe ./examples/infer/
      - GOOS=windows GOARCH=arm64 go build -o ./bin/windows_arm64/basic.exe ./examples/basic/
      - GOOS=windows GOARCH=arm64 go build -o ./bin/windows_arm64/sllm.exe  ./examples/sllm/
      - GOOS=windows GOARCH=arm64 go build -o ./bin/windows_arm64/infer.exe ./examples/infer/

  build:examples:darwin:
    desc: Build example binaries for macOS (amd64 and arm64)
    cmds:
      - mkdir -p ./bin/darwin_amd64 ./bin/darwin_arm64
      - GOOS=darwin GOARCH=amd64 go build -o ./bin/darwin_amd64/basic ./examples/basic/
      - GOOS=darwin GOARCH=amd64 go build -o ./bin/darwin_amd64/sllm  ./examples/sllm/
      - GOOS=darwin GOARCH=amd64 go build -o ./bin/darwin_amd64/infer ./examples/infer/
      - GOOS=darwin GOARCH=arm64 go build -o ./bin/darwin_arm64/basic ./examples/basic/
      - GOOS=darwin GOARCH=arm64 go build -o ./bin/darwin_arm64/sllm  ./examples/sllm/
      - GOOS=darwin GOARCH=arm64 go build -o ./bin/darwin_arm64/infer ./examples/infer/

  build:dist:
    desc: Build example binaries for all platforms (native, Linux, macOS, Windows)
    deps:
      - build:examples
      - build:examples:linux
      - build:examples:darwin
      - build:examples:windows

  run:sllm:
    desc: "Run a script through sllm (usage: task run:sllm -- script.py)"
    cmds:
      - go run ./examples/sllm/ {{.CLI_ARGS}}

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  check:
    desc: Run all checks (fmt, vet, lint, test, build)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: build

  ci:
    desc: Run CI pipeline (test + coverage)
    cmds:
      - go test -race -count=1 -run='^Test' -timeout 15m -coverprofile=coverage.txt -covermode=atomic ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.txt coverage.html

  smoke:
    desc: Run smoke test against all available models
    cmds:
      - go test -tags=smoke -run='TestSmokeAllModels$' -v -timeout 600s ./...

  models:download:
    desc: Download test models from HuggingFace (~5GB total)
    cmds:
      - mkdir -p models
      - for:
          - name: SmolLM2-135M-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf
          - name: SmolLM2-135M-Instruct-Q4_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_0.gguf
          - name: SmolLM2-360M-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q8_0.gguf
          - name: SmolLM2-360M-Instruct-Q4_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q4_0.gguf
          - name: SmolLM2-1.7B-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-1.7B-Instruct-GGUF/resolve/main/SmolLM2-1.7B-Instruct-Q8_0.gguf
          - name: SmolLM2-1.7B-Instruct-Q4_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-1.7B-Instruct-GGUF/resolve/main/SmolLM2-1.7B-Instruct-Q4_0.gguf
          - name: tinyllama-1.1b-1t-openorca.Q8_0.gguf
            url: https://huggingface.co/TheBloke/TinyLlama-1.1B-1T-OpenOrca-GGUF/resolve/main/tinyllama-1.1b-1t-openorca.Q8_0.gguf
        cmd: |
          if [ -f "models/{{.ITEM.name}}" ]; then
            echo "SKIP (exists): models/{{.ITEM.name}}"
          else
            echo "Downloading {{.ITEM.name}}..."
            curl -L --progress-bar -o "models/{{.ITEM.name}}" "{{.ITEM.url}}"
          fi

  models:download:extra:
    desc: Download additional compatible models (Llama 3.2 1B, Qwen2.5 0.5B, Qwen3 1.7B)
    cmds:
      - mkdir -p models
      - for:
          - name: Llama-3.2-1B-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q8_0.gguf
          - name: Qwen2.5-0.5B-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q8_0.gguf
          - name: Qwen3-1.7B-Q8_0.gguf
            url: https://huggingface.co/bartowski/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf
        cmd: |
          if [ -f "models/{{.ITEM.name}}" ]; then
            echo "SKIP (exists): models/{{.ITEM.name}}"
          else
            echo "Downloading {{.ITEM.name}}..."
            curl -L --progress-bar -o "models/{{.ITEM.name}}" "{{.ITEM.url}}"
          fi

  models:clean:
    desc: Remove downloaded model files
    cmds:
      - rm -f models/*.gguf
  
  release:
    desc: 'Create a version tag and push it (usage: task release -- v0.1.0)'
    deps: [fmt, vet, lint, ci, build]
    preconditions:
      - sh: 'test -n "{{.CLI_ARGS}}"'
        msg: 'version tag required (e.g. task release -- v0.1.0)'
      - sh: 'git diff --quiet'
        msg: 'working tree has uncommitted changes'
    cmds:      
      - git tag {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
      - echo "Tagged and pushed {{.CLI_ARGS}}"
