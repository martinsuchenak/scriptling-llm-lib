version: "3"

tasks:
  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w -s .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...
    preconditions:
      - sh: which golangci-lint
        msg: "golangci-lint not installed. See https://golangci-lint.run/usage/install/"

  test:
    desc: Run tests
    cmds:
      - go test -race -count=1 ./...

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - go test -v -race -count=1 ./...

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - go tool cover -html=coverage.txt -o coverage.html
      - go tool cover -func=coverage.txt

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  build:example:
    desc: Build the basic example binary
    cmds:
      - go build -o ./bin/example ./examples/basic/

  build:cli:
    desc: Build the CLI binary
    cmds:
      - go build -o ./bin/scriptling-llm ./examples/cli/

  run:cli:
    desc: "Run a script through the CLI (usage: task run:cli -- script.py)"
    cmds:
      - go run ./examples/cli/ {{.CLI_ARGS}}


  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  check:
    desc: Run all checks (fmt, vet, lint, test, build)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: build

  ci:
    desc: Run CI pipeline (test + coverage)
    cmds:
      - go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.txt coverage.html
  
  release:
    desc: 'Create a version tag and push it (usage: task release -- v0.1.0)'
    deps: [fmt, vet, lint, ci, build]
    preconditions:
      - sh: 'test -n "{{.CLI_ARGS}}"'
        msg: 'version tag required (e.g. task release -- v0.1.0)'
      - sh: 'git diff --quiet'
        msg: 'working tree has uncommitted changes'
    cmds:      
      - git tag {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
      - echo "Tagged and pushed {{.CLI_ARGS}}"
